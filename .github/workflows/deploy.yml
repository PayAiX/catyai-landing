name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  # Deploys catyai.io / www.catyai.io — lives in the NEW AWS account (161313036761,
  # eu-central-1) since the 12 Jul cutover. Uses its own credentials/region because
  # deploy-webview below intentionally still targets the OLD account (webview.catyai.io
  # was not part of that migration).
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_LANDING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_LANDING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete --exclude "cdn/*"

      - name: Fix content-type for .well-known/ucp
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET }}/.well-known/ucp \
            s3://${{ secrets.S3_BUCKET }}/.well-known/ucp \
            --content-type "application/json" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # Deploys webview.catyai.io — NEW AWS account (161313036761, eu-central-1)
  # since the 11 Aug 2026 migration (was intentionally left on the old account
  # at the 12 Jul cutover). Uses the same landing credentials, new bucket and
  # the new distribution E1UZRW6IW3TM8G (OAC, bucket privat).
  deploy-webview:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build webview
        run: npm run build:webview

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_LANDING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_LANDING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy webview assets to S3
        run: |
          aws s3 sync webview-dist/ s3://webview-catyai-io-eucentral1 \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Deploy webview index.html (no-cache)
        run: |
          aws s3 cp webview-dist/index.html \
            s3://webview-catyai-io-eucentral1/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront webview cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1UZRW6IW3TM8G \
            --paths "/*"
