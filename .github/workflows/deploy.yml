name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  # Deploys catyai.io / www.catyai.io — contul AWS 079862077746 (Dubai, eu-central-1)
  # din 6 oct 2026. Contul 161313036761 a fost terminat de AWS pe 18 sept 2026; cheile
  # vechi din AWS_*_LANDING dădeau „The security token included in the request is
  # invalid" din 11 sept (ultimul deploy verde). Bucketul este servit DIRECT de nginx
  # de pe box-ul Lightsail (proxy către website hosting) — NU există distribuție
  # CloudFront pentru catyai.io în contul nou, deci nu se mai invalidează nimic.
  # Credențiale: userul IAM dedicat `catyai-landing-deploy` (politica din
  # .github/aws/landing-deploy-policy.json: doar bucketul landing).
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_LANDING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_LANDING }}
          aws-region: ${{ env.AWS_REGION }}

      # `sync --delete` șterge obiecte din bucket; regula casei: NICIODATĂ fără
      # versioning activ (rollback = restaurarea versiunii anterioare).
      - name: Guard — bucket versioning must be Enabled before sync --delete
        run: |
          STATUS=$(aws s3api get-bucket-versioning --bucket "${{ secrets.S3_BUCKET }}" --query Status --output text)
          echo "Versioning status: ${STATUS}"
          if [ "${STATUS}" != "Enabled" ]; then
            echo "::error::Bucket versioning is '${STATUS}', not 'Enabled' — refusing to run 'aws s3 sync --delete'. Enable versioning on the bucket first."
            exit 1
          fi

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete --exclude "cdn/*"

      - name: Fix content-type for .well-known/ucp
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET }}/.well-known/ucp \
            s3://${{ secrets.S3_BUCKET }}/.well-known/ucp \
            --content-type "application/json" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=3600"

      - name: Verify deploy landed (index.html LastModified = now)
        run: |
          aws s3api head-object --bucket "${{ secrets.S3_BUCKET }}" --key index.html --query LastModified --output text

  # webview.catyai.io — 6 oct 2026: domeniul NU mai are înregistrare DNS, bucketul
  # `webview-catyai-io-eucentral1` și distribuția E1UZRW6IW3TM8G erau în contul mort.
  # În contul 079862077746 există `webview-catyai-io-eucentral1-079862077746` (ultimul
  # index.html: 16 sept), fără website hosting și fără CloudFront. Jobul rămâne OPRIT
  # (variabila de repo DEPLOY_WEBVIEW != 'true') până se decide DNS-ul + servirea;
  # politica userului `catyai-landing-deploy` nu acoperă acest bucket.
  deploy-webview:
    if: vars.DEPLOY_WEBVIEW == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build webview
        run: npm run build:webview

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_LANDING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_LANDING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy webview assets to S3
        run: |
          aws s3 sync webview-dist/ s3://webview-catyai-io-eucentral1-079862077746 \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Deploy webview index.html (no-cache)
        run: |
          aws s3 cp webview-dist/index.html \
            s3://webview-catyai-io-eucentral1-079862077746/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

