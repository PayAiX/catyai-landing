    <!-- Consent Mode v2: totul refuzat până la alegerea din bannerul de cookie-uri (body).
         Trebuie să ruleze ÎNAINTE de orice gtag('config') — de aceea stă primul în <head>.
         Aceeași logică și același cookie (caty_consent) ca bannerul de pe shop.catyai.io (Caty.AI #857/#858),
         extinsă la semnalele de reclamă (Google Ads AW-18223286697 + Meta Pixel). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
      (function () {
        var m = document.cookie.match(/(?:^|; )caty_consent=([^;]*)/);
        if (m && m[1] === 'granted') {
          gtag('consent', 'update', { ad_storage: 'granted', analytics_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted' });
        }
      })();
    </script>

    <script>
      (function () {
        var NAME = 'caty_consent';
        var MAX_AGE_DAYS = 180;
        var banner = document.getElementById('caty-consent-banner');
        var match = document.cookie.match(/(?:^|; )caty_consent=([^;]*)/);
        var stored = match ? match[1] : null;
        if (banner) banner.style.display = stored === 'granted' || stored === 'denied' ? 'none' : 'block';

        function applyConsent(granted) {
          var v = granted ? 'granted' : 'denied';
          gtag('consent', 'update', { ad_storage: v, analytics_storage: v, ad_user_data: v, ad_personalization: v });
          if (typeof fbq === 'function') fbq('consent', granted ? 'grant' : 'revoke');
        }

        document.addEventListener('click', function (e) {
          var id = e.target && e.target.id;
          if (id !== 'caty-consent-accept' && id !== 'caty-consent-reject') return;
          var granted = id === 'caty-consent-accept';
          var expires = new Date(Date.now() + MAX_AGE_DAYS * 864e5).toUTCString();
          document.cookie = NAME + '=' + (granted ? 'granted' : 'denied') + '; expires=' + expires + '; path=/; SameSite=Lax; Secure';
          applyConsent(granted);
          if (banner) banner.style.display = 'none';
        });
      })();
